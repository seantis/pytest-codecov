[build-system]
requires = [
  "setuptools>=61.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-codecov"
dynamic = ["version"]
description = "Pytest plugin for uploading pytest-cov results to codecov.io"
readme = "README.rst"
requires-python = ">=3.11"
authors = [
    { name = "David Salvisberg", email = "david.salvisberg@seantis.ch" },
]
maintainers = [
    { name = "David Salvisberg", email = "david.salvisberg@seantis.ch" },
]
license = { file = "LICENSE" }
classifiers = [
    "Framework :: Pytest",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pytest>=4.6.0",
    "pytest-cov>=2.11.0",
    "coverage[toml]>=5.2.1",
    "requests>=2.25.1",
]

[project.optional-dependencies]
git = [
    "GitPython>=3.1.15",
]

[dependency-groups]
dev = [
    "bandit",
    "mypy",
    "prek",
    "ruff",
    "tox",
    "tox-uv",
    "types-requests",
    "uv",
]

[project.urls]
Repository = "https://github.com/seantis/pytest-codecov"

[project.entry-points.pytest11]
codecov = "pytest_codecov"

[tool.setuptools.package-data]
pytest_codecov = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "pytest_codecov.__version__"}

[tool.bandit]
skips = ["B101"]

[tool.coverage.paths]
source = ["src"]

[tool.coverage.run]
source = ["pytest_codecov"]

[tool.coverage.report]
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "pragma: unreachable",
    "assert_never[(]",
    "@overload",
    "raise NotImplementedError",
    "raise AssertionError[(].unreachable.[)]",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__."
]

[tool.mypy]
python_version = "3.11"
follow_imports = "silent"
namespace_packages = true
explicit_package_bases = true
strict = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
src = ["src", "test"]
include = [
    "pyproject.toml",
    "src/**/*.py",
    "tests/**/*.py",
]
line-length = 79
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
    "ASYNC",
    "B0",
    "C4",
    "E",
    "F",
    "FURB",
    "G2",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PT",
    "PYI",
    "Q",
    "RUF",
    "S",
    "SIM",
    "SLOT",
    "T",
    "UP",
    "W",
    "blanket-noqa",
    "invalid-mock-access",
    "logging-warn",
    "loop-iterator-mutation",
    "missing-required-import",
    "raise-without-from-inside-except",
    "static-join-to-f-string",
    "stdlib-module-shadowing",
    "trailing-comma-on-bare-tuple",
]
ignore = [
    "non-empty-init-module",
    "read-whole-file",
    "write-whole-file",
]
unfixable = []
preview = true

[tool.ruff.lint.extend-per-file-ignores]
"src/**/*.py" = ["PT"]
"tests/**/*.py" = [
  "S",
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pep8-naming]
extend-ignore-names = []
classmethod-decorators = []

[tool.ruff.lint.flake8-quotes]
avoid-escape = true
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.tox]
isolated_build = true
env_list = [
    "py311",
    "py312",
    "py313",
    "py314",
    "py315",
    "ruff",
    "bandit",
    "mypy",
    "report",
]

[tool.tox.gh.python]
"3.11" = ["py311"]
"3.12" = ["py312", "ruff", "bandit", "mypy"]
"3.13" = ["py313"]
"3.14" = ["py314"]
"3.15" = ["py315"]

[tool.tox.env_run_base]
use_develop = true
set_env.COVERAGE_FILE = { replace = "if", condition = "not factor.report", then = ".coverage.{env_name}"}
deps = [
    "coverage[toml]",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    ".",
    "GitPython"
]
commands = [
    [
        "pytest",
        "--cov",
        "--cov-report=",
        { replace = "posargs", default = ["tests"], extend = true }
    ],
    [
        "pytest",
        "-n2",
        "--cov",
        "--cov-report=",
        { replace = "posargs", default = ["tests"], extend = true }
    ],
]

[tool.tox.env.ruff]
base_python = "python3.12"
deps = ["ruff"]
commands = [["ruff", "check"]]

[tool.tox.env.mypy]
base_python = "python3.12"
deps = [
    "GitPython",
    "pytest",
    "types-requests",
]
commands = [
    ["mypy", "-p", "pytest_codecov", "-p", "tests", "--python-version", "3.11"],
    ["mypy", "-p", "pytest_codecov", "-p", "tests", "--python-version", "3.12"],
    ["mypy", "-p", "pytest_codecov", "-p", "tests", "--python-version", "3.13"],
    ["mypy", "-p", "pytest_codecov", "-p", "tests", "--python-version", "3.14"],
    ["mypy", "-p", "pytest_codecov", "-p", "tests", "--python-version", "3.15"],
]

[tool.tox.env.bandit]
base_python = "python3.12"
deps = ["bandit[toml]"]
commands = [["bandit", "-q", "-c", "pyproject.toml", "-r", "src"]]

[tool.tox.env.report]
base_python = "python3.12"
skip_install = true
deps = ["coverage"]
commands = [
    ["coverage", "combine"],
    ["coverage", "report", "-m"],
]
